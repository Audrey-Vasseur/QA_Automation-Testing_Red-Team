# UI test configuration (Appium / WordPress Android).
# Optional: copy to config.properties (git-ignored) to override values.
# Any key can also be set with an environment variable: wait.seconds -> WAIT_SECONDS

appium.url=http://127.0.0.1:4723

app.package=org.wordpress.android
app.activity=org.wordpress.android.ui.WPLaunchActivity
app.install=false
app.path=C:/Users/<you>/wordpress-apk/wpandroid-27.7.apk

# Comma-separated list from "adb devices". Several devices = real parallel execution.
devices=emulator-5554

wait.seconds=20

# WordPress API configuration
api.base.url=https://public-api.wordpress.com
api.site.id=258362681
