# ---------------------------------------------------------------------------
# Configuration des tests UI (Appium / WordPress Android)
# Copier ce fichier en "config.properties" (meme dossier) et le completer.
# config.properties est ignore par Git : n'y mettez jamais de secret ailleurs.
# Chaque cle peut aussi venir d'une variable d'environnement : wp.password -> WP_PASSWORD
# ---------------------------------------------------------------------------

# Serveur Appium
appium.url=http://127.0.0.1:4723

# Application testee (deja installee sur le telephone avec install-apk.bat ou "adb install")
app.package=org.wordpress.android
app.activity=org.wordpress.android.ui.WPLaunchActivity
# Optionnel : laisser Appium installer l'APK (necessite les build-tools Android / aapt2)
app.install=false
app.path=C:/Users/<vous>/IdeaProjects/wordpress-apk/wpandroid-27.7.apk

# Emulateurs disponibles (adb devices). Plusieurs = execution parallele reelle.
devices=emulator-5554

# Attente maximale des elements (secondes)
wait.seconds=20

# Compte WordPress de TEST (jamais un compte personnel). A remplir dans config.properties.
wp.username=
wp.password=
wp.site=
